[project]
name = "harkd"
dynamic = ["version"]
description = "Meeting minutes, summaries, transcription & diarization, and task extraction daemon with REST API"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "AGPL-3.0-or-later"}
dependencies = [
    # Core audio
    "sounddevice>=0.5.0",
    "numpy>=1.24.0",
    "soundfile>=0.12.0",

    # Transcription (faster-whisper)
    "faster-whisper>=1.0.0",

    # Audio preprocessing
    "noisereduce>=3.0.0",
    "librosa>=0.10.0",

    # Configuration
    "pyyaml>=6.0.1",

    # PulseAudio integration (Linux)
    "pulsectl>=24.0.0; sys_platform == 'linux'",

    # WASAPI loopback (Windows)
    "PyAudioWPatch>=0.2.12.7; sys_platform == 'win32'",

    # Daemon / API
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.6",

    # Diarization
    "whisperx>=3.1.0",

    # Remote transcription backends
    "httpx>=0.27.0",
    "boto3>=1.34.0",

    # LLM integration
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-ollama>=0.2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.1.0",
    "pyrefly>=0.45.0",
    "pre-commit>=3.0.0",
    "httpx>=0.27.0",
]
dev = [
    "harkd[test]",
]

[project.scripts]
harkd = "harkd.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harkd"]

[tool.hatch.version]
path = "src/harkd/__init__.py"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM117"]  # Allow nested with statements in tests for readability

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src/harkd"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
